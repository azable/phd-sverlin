services:
  - type: web
    name: sverlin-web
    runtime: docker
    region: singapore
    # Compilation and the web process share one service, so the established
    # compiler ceiling belongs here rather than on a separate worker.
    plan: 2c-4g
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: node build
    preDeployCommand: node build-migrate/index.js
    healthCheckPath: /api/health/ready
    # Render allows 300 seconds. Application work is cancelled after 270 seconds,
    # leaving time to persist terminal Timeline events and close PostgreSQL.
    maxShutdownDelaySeconds: 300
    autoDeployTrigger: off
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sverlin-postgres
          property: connectionString
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: SVERLIN_ADMIN_SETUP_TOKEN
        generateValue: true
      - key: SVERLIN_SHUTDOWN_TIMEOUT_SECONDS
        value: '270'
      - key: OPENAI_API_KEY
        sync: false

databases:
  - name: sverlin-postgres
    region: singapore
    # Two users and process-local pools capped at five connections per service
    # fit the smallest persistent plan; resize from dashboard metrics if needed.
    plan: 0.1c-256mb
    postgresMajorVersion: '17'
    ipAllowList: []
