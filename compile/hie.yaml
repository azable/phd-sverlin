cradle:
  stack:
    - path: './src'
      component: 'compile:lib'

    # Two executables share app/, so visualization-types' own modules come
    # before the compile-app entry that covers the rest of the directory.
    - path: './app/GenerateVisualizationTypes.hs'
      component: 'compile:exe:visualization-types'
    - path: './app/GenerateVisualizationTypes'
      component: 'compile:exe:visualization-types'
    - path: './app'
      component: 'compile:exe:compile-app'

    # Three test suites share test/, and solver-test covers the remainder.
    - path: './test/SemanticTestMain.hs'
      component: 'compile:test:semantic-test'
    - path: './test/SemanticTest.hs'
      component: 'compile:test:semantic-test'
    - path: './test/MetricsTest.hs'
      component: 'compile:test:semantic-test'
    - path: './test/RenderGuardTest.hs'
      component: 'compile:test:semantic-test'
    - path: './test/TypographyTest.hs'
      component: 'compile:test:semantic-test'
    - path: './test/SverlinSourceTest.hs'
      component: 'compile:test:sverlin-source-test'
    - path: './test'
      component: 'compile:test:solver-test'
    - path: './test-support'
      component: 'compile:test:solver-test'

    - path: './bench'
      component: 'compile:exe:solver-bench'
